services:
  postgres:
    image: postgres:16-alpine
    container_name: manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manager
    ports:
      - "5432:5432"
    volumes:
      - manager-postgres-data:/var/lib/postgresql/data

volumes:
  manager-postgres-data: